# Static serving for the Gozar Console SPA.
#
# History-API fallback: any unknown path falls back to index.html so client-side
# routing (react-router) works on hard refresh and deep links. Static assets are
# cache-friendly; index.html is never cached so deployments take effect promptly.
#
# The SPA is built with an empty VITE_API_BASE_URL (same-origin), so this server
# also reverse-proxies the backend API surfaces (`/api` control-path and `/v1`
# proxy data-path) to the `backend` service on the compose network. Using a
# variable in proxy_pass with Docker's embedded DNS resolver means nginx resolves
# the backend lazily per request and starts even if the backend is briefly
# unavailable, rather than failing at config-load time.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; lets us use a variable upstream (lazy resolution).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Admin control-path API.
    location /api/ {
        set $gozar_backend http://backend:8000;
        proxy_pass $gozar_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAI-compatible proxy data-path (supports SSE streaming).
    location /v1/ {
        set $gozar_backend http://backend:8000;
        proxy_pass $gozar_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming-friendly: do not buffer SSE chunks; allow long-lived responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Liveness/readiness probes proxied through for convenience.
    location = /health {
        set $gozar_backend http://backend:8000;
        proxy_pass $gozar_backend$request_uri;
    }
    location = /ready {
        set $gozar_backend http://backend:8000;
        proxy_pass $gozar_backend$request_uri;
    }

    # Long-cache hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
