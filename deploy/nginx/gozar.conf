# Gozar reverse-proxy server block (subdomain entrypoint) - gozar.example.com.
#
# Public entrypoint for a self-hosted Gozar deployment. It terminates TLS, applies
# a modest security posture (security headers, rate limiting, request-size limits,
# no server tokens), and proxies to the loopback-bound containers started by
# compose.prod.yml:
#
#   * everything else        -> the Web_Console SPA           (127.0.0.1:8080)
#   * /api/  (admin API)      -> the backend control-path      (127.0.0.1:8000)
#   * /v1/   (OpenAI proxy)   -> the backend data-path (SSE)   (127.0.0.1:8000)
#   * /health,/ready          -> the backend probes            (127.0.0.1:8000)
#
# This is the "n8n-style" production config: real Let's Encrypt certificate + an
# HTTP->HTTPS redirect. Requires deploy/nginx/gozar-ratelimit.conf installed in the
# HTTP context (conf.d) and deploy/nginx/gozar-proxy.conf in snippets/. See
# deploy/nginx/README.md.

# --- Upstreams (loopback-bound containers from compose.prod.yml) -------------
upstream gozar_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}
upstream gozar_console {
    server 127.0.0.1:8080;
    keepalive 32;
}

# --- HTTP: redirect everything to HTTPS (and serve ACME challenges) ----------
server {
    listen 80;
    listen [::]:80;
    server_name gozar.example.com;

    # Allow certbot HTTP-01 challenges before the redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the real entrypoint ----------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gozar.example.com;

    # --- TLS (certbot paths; run: certbot --nginx -d gozar.example.com) ------
    ssl_certificate     /etc/letsencrypt/live/gozar.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gozar.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GozarSSL:10m;
    ssl_session_tickets off;

    # --- Hardening -----------------------------------------------------------
    server_tokens off;                       # do not advertise the nginx version
    client_max_body_size 25m;                # cap prompt/request body size
    limit_conn gozar_conn 50;                # max concurrent connections per IP

    # Security response headers (safe defaults for an API + SPA).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;  # modern browsers: rely on CSP, disable legacy auditor

    # Only allow the methods the API actually uses; reject the rest early.
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$) {
        return 405;
    }

    # Optional: restrict the admin surface to trusted networks. Left commented so
    # the admin console is reachable by default; uncomment + set your IPs to make
    # /api private while leaving /v1 open to applications.
    # location /api/ {
    #     allow 203.0.113.0/24;   # your office/VPN range
    #     allow 10.0.0.0/8;
    #     deny all;
    #     ... (then the proxy block below)
    # }

    # --- Auth endpoints: strictest rate limit (brute-force protection) -------
    location /api/auth/ {
        limit_req zone=gozar_auth burst=5 nodelay;
        proxy_pass http://gozar_backend;
        include /etc/nginx/snippets/gozar-proxy.conf;
    }

    # --- Admin control-path --------------------------------------------------
    location /api/ {
        limit_req zone=gozar_admin burst=20 nodelay;
        proxy_pass http://gozar_backend;
        include /etc/nginx/snippets/gozar-proxy.conf;
    }

    # --- OpenAI-compatible proxy data-path (SSE streaming) -------------------
    location /v1/ {
        limit_req zone=gozar_api burst=40 nodelay;
        proxy_pass http://gozar_backend;
        include /etc/nginx/snippets/gozar-proxy.conf;

        # Streaming-friendly: never buffer SSE, allow long-lived responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # --- Operational probes (handy for external uptime checks) ---------------
    location = /health { proxy_pass http://gozar_backend; include /etc/nginx/snippets/gozar-proxy.conf; }
    location = /ready  { proxy_pass http://gozar_backend; include /etc/nginx/snippets/gozar-proxy.conf; }

    # --- Web console SPA (everything else) -----------------------------------
    location / {
        proxy_pass http://gozar_console;
        include /etc/nginx/snippets/gozar-proxy.conf;
    }
}
