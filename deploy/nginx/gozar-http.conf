# gozar.example.com -> Gozar console/proxy (compose.prod.yml frontend on 127.0.0.1:8080).
#
# HTTP-only bootstrap server block. `certbot --nginx -d gozar.example.com`
# upgrades this in place with a Let's Encrypt certificate and HTTP-to-HTTPS
# redirect. The console container proxies /api and /v1 to the backend internally,
# so a single upstream (127.0.0.1:8080) serves the SPA, the admin API, and the
# OpenAI-compatible proxy.

server {
    listen 80;
    listen [::]:80;
    server_name gozar.example.com;

    client_max_body_size 25m;

    # OpenAI-compatible proxy data-path: stream Server-Sent Events unbuffered.
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Console SPA + admin API (everything else).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
