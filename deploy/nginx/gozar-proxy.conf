# Shared proxy headers for Gozar locations (included by deploy/nginx/gozar.conf).
#
# Install as an nginx snippet:
#   sudo cp deploy/nginx/gozar-proxy.conf /etc/nginx/snippets/gozar-proxy.conf
#
# Forwards the original client/protocol/host so the backend sees the real request
# (the X-Forwarded-* headers feed the app's logging/trace metadata). HTTP/1.1 with
# an empty Connection header keeps upstream keepalive working and lets SSE stream.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";
proxy_connect_timeout 10s;
