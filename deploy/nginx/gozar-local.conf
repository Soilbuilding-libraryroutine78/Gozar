# Gozar reverse proxy - local/self-signed style.
#
# Single server block listening on 80 + 443 with a self-signed certificate, the same
# convention many local nginx setups use. Use this on a local/dev box where the
# subdomain resolves here (e.g. via /etc/hosts or local DNS). For a public server
# with a real Let's Encrypt certificate, use gozar.conf instead.
#
# It proxies to the loopback-bound containers from compose.prod.yml:
#   /api/ , /v1/ , /health , /ready  -> backend  (127.0.0.1:8000)
#   everything else                  -> console  (127.0.0.1:8080)
#
# Install (hostname already set to gozar.local.test; change if needed):
#   sudo openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
#     -keyout /etc/nginx/ssl/gozar.local.test.key \
#     -out    /etc/nginx/ssl/gozar.local.test.crt -subj "/CN=gozar.local.test"
#   sudo cp deploy/nginx/gozar-local.conf /etc/nginx/sites-available/gozar.conf
#   sudo ln -s /etc/nginx/sites-available/gozar.conf /etc/nginx/sites-enabled/gozar.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   # if it only resolves locally:  echo "127.0.0.1 gozar.local.test" | sudo tee -a /etc/hosts

server {
    listen 80;
    listen 443 ssl http2;
    server_name gozar.local.test;

    # Self-signed SSL (local/dev).
    ssl_certificate     /etc/nginx/ssl/gozar.local.test.crt;
    ssl_certificate_key /etc/nginx/ssl/gozar.local.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- Light hardening ("a little safe") -----------------------------------
    server_tokens off;
    client_max_body_size 25m;               # cap prompt/request body size

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Only allow the methods the API uses.
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$) {
        return 405;
    }

    # Optional: keep the admin console private (uncomment + set your IPs). Left open
    # by default; /v1 stays reachable for applications regardless.
    # location /api/ {
    #     allow 127.0.0.1; allow 192.168.0.0/16; deny all;
    #     proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/gozar-proxy.conf;
    # }

    # OpenAI-compatible proxy data-path (SSE streaming).
    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Stream chunk-by-chunk; allow long-lived responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Admin control-path.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Operational probes.
    location = /health { proxy_pass http://127.0.0.1:8000/health; proxy_set_header Host $host; }
    location = /ready  { proxy_pass http://127.0.0.1:8000/ready;  proxy_set_header Host $host; }

    # Web console SPA (everything else).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
