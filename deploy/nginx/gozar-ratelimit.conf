# Gozar rate-limit + connection-limit zones (HTTP context).
#
# Install into the nginx HTTP context, NOT inside a server block:
#   sudo cp deploy/nginx/gozar-ratelimit.conf /etc/nginx/conf.d/gozar-ratelimit.conf
#
# These zones are referenced by deploy/nginx/gozar.conf. Keeping them in conf.d
# (which nginx includes inside http{}) is what makes `limit_req_zone` valid, since
# that directive is only allowed at the http level.
#
# Tune the rates to your traffic. The defaults are deliberately conservative: they
# slow down abusive clients without getting in the way of normal use. Keys are the
# client IP taken from $binary_remote_addr (set $real_ip via the proxy headers if
# you sit behind another proxy/CDN).

# Admin control-path: tighter (the console is low-volume, human-driven).
limit_req_zone $binary_remote_addr zone=gozar_admin:10m rate=30r/m;

# OpenAI-compatible data-path: higher, app traffic can be bursty.
limit_req_zone $binary_remote_addr zone=gozar_api:10m rate=120r/m;

# Auth endpoints: strict, to blunt credential-stuffing / brute force.
limit_req_zone $binary_remote_addr zone=gozar_auth:10m rate=10r/m;

# Cap concurrent connections per client IP.
limit_conn_zone $binary_remote_addr zone=gozar_conn:10m;
