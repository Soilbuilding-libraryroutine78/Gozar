[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gozar"
version = "0.1.0"
description = "Self-hosted, OpenAI-compatible LLM proxy that routes traffic through your own subscription accounts and API keys."
readme = "README.md"
requires-python = ">=3.12"
# Source-available noncommercial license: grants use, modification, and redistribution
# for noncommercial purposes. Full text in LICENSE.
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Gozar contributors" }]

# Exact, pinned runtime dependencies (no open ranges).
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "httpx==0.28.1",
    "redis==5.2.1",
    "cryptography==44.0.0",
    "argon2-cffi==23.1.0",
    "pyjwt==2.10.1",
]

[project.optional-dependencies]
# Test/dev tooling, pinned exactly.
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "hypothesis==6.123.2",
    "asgi-lifespan==2.1.0",
    "aiosqlite==0.20.0",
]

[tool.setuptools.packages.find]
include = ["gozar*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "gozar"]
python_files = ["test_*.py", "*_test.py"]
