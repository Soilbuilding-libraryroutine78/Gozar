# Alembic configuration for Gozar.
#
# The database URL is intentionally NOT set here. It is read at runtime from
# gozar/core/config.py (GOZAR_DATABASE_URL) inside migrations/env.py, so there are
# no credentials or hardcoded URLs in this file.

[alembic]
# Path to migration scripts (relative to this file).
script_location = migrations

# Template used to generate migration file names; a UTC timestamp prefix keeps
# them ordered chronologically and easy to scan.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Use OS-native path separators.
prepend_sys_path = .
timezone = UTC

# sqlalchemy.url is deliberately left blank; env.py injects it from settings.
sqlalchemy.url =

[post_write_hooks]
# No automatic formatting hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
